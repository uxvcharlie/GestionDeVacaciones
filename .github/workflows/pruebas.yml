# ===========================================================================
#  Compila y corre TODAS las pruebas en cada push y en cada pull request:
#  las de la aplicación web y las de la app para celular (app-android/).
#
#  Las pruebas levantan un PostgreSQL real con Testcontainers; las máquinas
#  de GitHub ya traen Docker, así que no hace falta configurar nada.
#  El repositorio es público: estos minutos no tienen costo.
# ===========================================================================
name: Pruebas

on:
  push:
  pull_request:

# Solo lectura: esta tarea no necesita escribir nada en el repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y correr las pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y probar
        run: ./mvnw -B verify

  estilos:
    name: La hoja de estilos está regenerada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar Tailwind y HTMX (versiones exactas de package-lock.json)
        run: npm ci

      # Si alguien cambió clases en un .html y se olvidó de correr "npm run css",
      # el archivo generado no coincide con el versionado y esta tarea falla.
      - name: Regenerar y comparar
        run: |
          npm run css
          npm run htmx
          git diff --exit-code -- src/main/resources/static \
            || { echo "::error::estilos.css o htmx.min.js no están al día. Corré: npm run css && npm run htmx"; exit 1; }

  app-android:
    name: App para celular (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-android
    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      # Comprueba que gradle-wrapper.jar sea el oficial de Gradle y no un
      # binario alterado: es lo primero que se ejecuta al compilar.
      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v6

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app-android/gradle/libs.versions.toml
            app-android/gradle/wrapper/gradle-wrapper.properties
            app-android/**/*.gradle.kts

      # Las máquinas de GitHub ya traen el Android SDK; solo falta la
      # plataforma exacta contra la que compila la app. "(yes || true)" evita
      # que el corte de "yes" al terminar las licencias haga fallar el paso.
      - name: Instalar la plataforma de Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-37.2" "build-tools;36.1.0" > /dev/null

      # Reglas de negocio (Kotlin puro) y base de datos real con Robolectric.
      - name: Pruebas de la app
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Sin la clave de firma (que nunca está en el repositorio) se compila la
      # versión de depuración: alcanza para saber que la app compila entera.
      - name: Compilar el APK de prueba
        run: ./gradlew --no-daemon :app:assembleDebug
