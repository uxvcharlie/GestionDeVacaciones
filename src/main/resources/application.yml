# ===========================================================================
#  Configuración de la aplicación
#
#  Regla: en este archivo NO hay ni una credencial. Todo lo sensible entra
#  por variables de entorno, con la sintaxis ${NOMBRE_VARIABLE}.
#  Este archivo sí se sube a GitHub; el archivo .env con los valores, no.
# ===========================================================================
spring:
  application:
    name: gestion-vacaciones

  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_PASSWORD}
    hikari:
      # Pool chico a propósito: la app corre con 512 MB de RAM y la base
      # gratuita de Neon tampoco admite muchas conexiones.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      # validate = Hibernate COMPARA sus entidades contra las tablas reales y
      # falla si no coinciden. Nunca "update": el esquema lo manda Flyway.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si la base no está vacía y no tiene historial de Flyway, preferimos que
    # falle y avise, en lugar de adivinar.
    baseline-on-migrate: false

  thymeleaf:
    cache: true

  web:
    locale: es_NI
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  servlet:
    session:
      # La sesión muere a los 30 minutos sin actividad.
      timeout: 30m
      cookie:
        name: SESION
        # HttpOnly: JavaScript no puede leer la cookie (protege ante XSS).
        http-only: true
        # Secure: la cookie solo viaja por HTTPS.
        # En local va en false porque http://localhost no es HTTPS y, con
        # true, el navegador no enviaría la cookie y no podrías entrar.
        secure: ${COOKIE_SEGURA:false}
        # Strict: la cookie no se envía si la petición viene de otro sitio.
        same-site: strict
  error:
    # Nunca mostrar detalles técnicos al usuario.
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Solo /actuator/health, que es lo que necesita Render para saber si
        # la aplicación está viva. Nada más queda expuesto.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    ni.gestionvacaciones: INFO

# ---------------------------------------------------------------------------
# Datos del administrador inicial. Se usan UNA sola vez: en el primer
# arranque, y solo si la tabla usuario está vacía.
# ---------------------------------------------------------------------------
app:
  admin-inicial:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD_INICIAL:}
    nombre: ${ADMIN_NOMBRE:}
