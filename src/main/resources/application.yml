# ===========================================================================
#  Configuración de la aplicación
#
#  Regla: en este archivo NO hay ni una credencial. Todo lo sensible entra
#  por variables de entorno, con la sintaxis ${NOMBRE_VARIABLE}.
#  Este archivo sí se sube a GitHub; el archivo .env con los valores, no.
# ===========================================================================
spring:
  application:
    name: gestion-vacaciones

  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_PASSWORD}
    hikari:
      # Pool chico a propósito: la app corre con 512 MB de RAM y la base
      # gratuita de Neon tampoco admite muchas conexiones.
      maximum-pool-size: 5
      # Neon apaga la base después de 5 minutos sin uso. Si el pool dejara
      # conexiones abiertas de sobra, la base nunca dormiría y gastaría horas
      # de cómputo del plan gratuito. Por eso: cero conexiones en reposo.
      minimum-idle: 0
      idle-timeout: 60000
      # Renovar cada conexión a los 5 minutos: Neon puede cortar las viejas.
      max-lifetime: 300000
      # Despertar la base tarda unos segundos: se espera hasta 30 s por una
      # conexión antes de mostrar el aviso de "el sistema se está despertando".
      connection-timeout: 30000

  jpa:
    hibernate:
      # validate = Hibernate COMPARA sus entidades contra las tablas reales y
      # falla si no coinciden. Nunca "update": el esquema lo manda Flyway.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Si la base no está vacía y no tiene historial de Flyway, preferimos que
    # falle y avise, en lugar de adivinar.
    baseline-on-migrate: false
    # Si al arrancar la base todavía está dormida, reintentar en vez de fallar.
    connect-retries: 10
    connect-retries-interval: 3s

  thymeleaf:
    cache: true

  web:
    locale: es_NI
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  # Al apagar (por ejemplo, en un despliegue nuevo), terminar las peticiones en curso.
  shutdown: graceful
  servlet:
    session:
      # La sesión muere a los 30 minutos sin actividad.
      timeout: 30m
      cookie:
        name: SESION
        # HttpOnly: JavaScript no puede leer la cookie (protege ante XSS).
        http-only: true
        # Secure: la cookie solo viaja por HTTPS.
        # En local va en false porque http://localhost no es HTTPS y, con
        # true, el navegador no enviaría la cookie y no podrías entrar.
        secure: ${COOKIE_SEGURA:false}
        # Strict: la cookie no se envía si la petición viene de otro sitio.
        same-site: strict
  error:
    # Nunca mostrar detalles técnicos al usuario.
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Solo /actuator/health, que es lo que necesita Render para saber si
        # la aplicación está viva. Nada más queda expuesto.
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness responde sin consultar la base: sirve para
      # que Render sepa que la aplicación está viva, y para el "ping" que la
      # mantiene despierta, sin despertar también la base de datos.
      probes:
        enabled: true

logging:
  level:
    root: INFO
    ni.gestionvacaciones: INFO

# ---------------------------------------------------------------------------
# Datos del administrador inicial. Se usan UNA sola vez: en el primer
# arranque, y solo si la tabla usuario está vacía.
# ---------------------------------------------------------------------------
app:
  seguridad:
    # En producción (perfil prod) se exige HTTPS. En tu computadora no, porque
    # http://localhost no tiene certificado.
    exigir-https: ${EXIGIR_HTTPS:false}
  admin-inicial:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD_INICIAL:}
    nombre: ${ADMIN_NOMBRE:}
