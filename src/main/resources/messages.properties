# ===========================================================================
#  Mensajes que muestra Spring cuando un valor escrito no se puede leer, por
#  ejemplo "1.5" en un campo de días o una fecha inválida.
#  Sin este archivo aparecerían en inglés y con palabras técnicas
#  ("Failed to convert property value of type...").
# ===========================================================================
typeMismatch=El valor escrito no es válido.
typeMismatch.java.lang.Integer=Escribí un número entero, sin decimales ni letras.
typeMismatch.java.lang.Long=Elegí una opción de la lista.
typeMismatch.java.time.LocalDate=Escribí una fecha válida.
typeMismatch.ni.gestionvacaciones.solicitud.TipoSolicitud=Elegí el tipo: vacaciones, cita médica o permiso.
typeMismatch.ni.gestionvacaciones.saldo.FormularioAjuste$Operacion=Elegí si vas a sumar o a restar.
