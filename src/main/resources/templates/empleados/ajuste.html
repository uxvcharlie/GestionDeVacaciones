<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Ajustar saldo', ~{::main})}">
<body>

<main id="contenido-principal">

    <div th:replace="~{fragmentos/encabezado :: barra}"></div>

    <div class="mx-auto max-w-lg px-4 py-8 space-y-6">

        <p><a th:href="@{/empleados/{id}(id=${empleado.id})}" class="enlace">← Volver a la ficha</a></p>

        <div>
            <h1 class="text-2xl font-semibold" th:text="|Ajustar el saldo de ${empleado.nombreCompleto}|">
                Ajustar el saldo
            </h1>
            <p class="text-suave mt-1">
                Saldo actual:
                <span class="text-texto font-semibold"
                      th:text="${@formatos.tiempo(empleado.saldoVacacionesMinutos, horasPorJornada)}">9 días</span>
            </p>
        </div>

        <div class="tarjeta">

            <div th:replace="~{fragmentos/mensajes :: avisos}"></div>

            <form th:action="@{/empleados/{id}/ajuste(id=${empleado.id})}" method="post"
                  th:object="${formulario}" class="space-y-6 mt-2">

                <fieldset class="space-y-3">
                    <legend class="etiqueta">¿Qué vas a hacer?</legend>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <label class="opcion">
                            <input type="radio" th:field="*{operacion}" th:value="'SUMAR'" class="size-5 accent-primario">
                            <span aria-hidden="true">＋</span>
                            <span class="font-medium">Sumar tiempo</span>
                        </label>
                        <label class="opcion">
                            <input type="radio" th:field="*{operacion}" th:value="'RESTAR'" class="size-5 accent-primario">
                            <span aria-hidden="true">－</span>
                            <span class="font-medium">Restar tiempo</span>
                        </label>
                    </div>
                    <p class="ayuda text-error" role="alert"
                       th:if="${#fields.hasErrors('operacion')}" th:errors="*{operacion}">Error</p>
                </fieldset>

                <fieldset class="space-y-3">
                    <legend class="etiqueta">¿Cuánto?</legend>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="etiqueta" for="dias">Días</label>
                            <input class="campo" type="number" th:field="*{dias}" min="0" max="3650" step="1"
                                   inputmode="numeric" th:classappend="${#fields.hasErrors('dias')} ? 'campo-error'">
                        </div>
                        <div>
                            <label class="etiqueta" for="horas">Horas</label>
                            <input class="campo" type="number" th:field="*{horas}" min="0" max="23" step="1"
                                   inputmode="numeric" th:classappend="${#fields.hasErrors('horas')} ? 'campo-error'">
                        </div>
                        <div>
                            <label class="etiqueta" for="minutos">Minutos</label>
                            <input class="campo" type="number" th:field="*{minutos}" min="0" max="59" step="1"
                                   inputmode="numeric" th:classappend="${#fields.hasErrors('minutos')} ? 'campo-error'">
                        </div>
                    </div>
                    <p class="ayuda text-error" role="alert" th:if="${#fields.hasErrors('dias')}" th:errors="*{dias}">Error</p>
                    <p class="ayuda text-error" role="alert" th:if="${#fields.hasErrors('horas')}" th:errors="*{horas}">Error</p>
                    <p class="ayuda text-error" role="alert" th:if="${#fields.hasErrors('minutos')}" th:errors="*{minutos}">Error</p>
                    <p class="ayuda" th:text="|Una jornada completa son ${horasPorJornada} horas.|">Una jornada completa son 8 horas.</p>
                </fieldset>

                <div>
                    <label class="etiqueta" for="motivo">Motivo</label>
                    <textarea class="campo min-h-20" th:field="*{motivo}" maxlength="300" rows="3" required
                              aria-describedby="ayuda-motivo"
                              th:classappend="${#fields.hasErrors('motivo')} ? 'campo-error'"></textarea>
                    <p id="ayuda-motivo" class="ayuda">Queda guardado en el historial del saldo, con tu nombre y la fecha.</p>
                    <p class="ayuda text-error" role="alert"
                       th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}">Error</p>
                </div>

                <label th:if="${pedirAutorizacion}" class="flex items-start gap-3 min-h-11 cursor-pointer">
                    <input type="checkbox" th:field="*{autorizarSaldoNegativo}" class="size-5 mt-0.5 accent-primario">
                    <span>Autorizo que el saldo quede en negativo. Queda registrado en la bitácora.</span>
                </label>

                <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                    <a th:href="@{/empleados/{id}(id=${empleado.id})}" class="boton-secundario">Cancelar</a>
                    <button type="submit" class="boton-primario" data-un-solo-envio>Guardar ajuste</button>
                </div>
            </form>
        </div>

    </div>

</main>

</body>
</html>
