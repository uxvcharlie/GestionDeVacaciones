<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Cambiar contraseña', ~{::main})}">
<body>

<main id="contenido-principal">

    <div th:replace="~{fragmentos/encabezado :: barra}"></div>

    <div class="mx-auto max-w-lg px-4 py-10">

        <h1 class="text-2xl font-semibold mb-2">Cambiá tu contraseña</h1>
        <p th:if="${obligatorio}" class="text-suave mb-6">
            Por seguridad, antes de usar el sistema tenés que reemplazar la contraseña
            que te entregaron por una que solo vos conozcas.
        </p>
        <p th:unless="${obligatorio}" class="text-suave mb-6">
            Escribí tu contraseña actual y la nueva. Las sesiones abiertas siguen funcionando.
        </p>

        <div class="tarjeta">

            <div th:replace="~{fragmentos/mensajes :: avisos}"></div>

            <form th:action="@{/cambiar-password}" method="post"
                  th:object="${formulario}" class="mt-5 space-y-5">

                <div>
                    <label class="etiqueta" for="actual">Contraseña actual</label>
                    <input class="campo" th:classappend="${#fields.hasErrors('actual')} ? 'campo-error'"
                           type="password" id="actual" th:field="*{actual}"
                           autocomplete="current-password" required>
                    <p class="ayuda text-error" th:if="${#fields.hasErrors('actual')}"
                       th:errors="*{actual}" role="alert">Error</p>
                </div>

                <div>
                    <label class="etiqueta" for="nueva">Contraseña nueva</label>
                    <input class="campo" th:classappend="${#fields.hasErrors('nueva')} ? 'campo-error'"
                           type="password" id="nueva" th:field="*{nueva}"
                           autocomplete="new-password" required
                           aria-describedby="ayuda-nueva">
                    <p class="ayuda" id="ayuda-nueva" th:text="${explicacionPassword}">Requisitos</p>
                    <p class="ayuda text-error" th:if="${#fields.hasErrors('nueva')}"
                       th:errors="*{nueva}" role="alert">Error</p>
                </div>

                <div>
                    <label class="etiqueta" for="confirmacion">Repetí la contraseña nueva</label>
                    <input class="campo" th:classappend="${#fields.hasErrors('confirmacion')} ? 'campo-error'"
                           type="password" id="confirmacion" th:field="*{confirmacion}"
                           autocomplete="new-password" required>
                    <p class="ayuda text-error" th:if="${#fields.hasErrors('confirmacion')}"
                       th:errors="*{confirmacion}" role="alert">Error</p>
                </div>

                <button type="submit" class="boton-primario w-full">Guardar la contraseña nueva</button>
                <a th:unless="${obligatorio}" th:href="@{/}" class="boton-secundario w-full">Cancelar</a>

            </form>
        </div>

    </div>

</main>

</body>
</html>
