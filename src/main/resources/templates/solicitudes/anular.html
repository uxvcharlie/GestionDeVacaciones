<!DOCTYPE html>
<!-- Confirmación con nombre explícito y motivo obligatorio antes de anular. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Anular solicitud', ~{::main})}">
<body>

<main id="contenido-principal">

    <div th:replace="~{fragmentos/encabezado :: barra}"></div>

    <div class="mx-auto max-w-lg px-4 py-10">
        <div class="tarjeta space-y-5">

            <div class="text-center">
                <span class="text-alerta text-5xl block mb-4" aria-hidden="true">⚠</span>
                <h1 class="text-2xl font-semibold"
                    th:text="|¿Anular la solicitud de ${#strings.toLowerCase(solicitud.tipo.etiqueta)} de ${empleado.nombreCompleto}?|">
                    ¿Anular la solicitud de vacaciones de María González?
                </h1>
            </div>

            <dl class="space-y-3">
                <div>
                    <dt class="text-suave text-sm">Fechas</dt>
                    <dd th:text="${solicitud.deUnSoloDia} ? |el ${@formatos.fecha(solicitud.fechaInicio)}| : |del ${@formatos.fecha(solicitud.fechaInicio)} al ${@formatos.fecha(solicitud.fechaFin)}|">
                        del 10/11/2026 al 14/11/2026
                    </dd>
                </div>
                <div>
                    <dt class="text-suave text-sm">Tiempo que se devuelve</dt>
                    <dd th:text="${solicitud.tipo.formatear(solicitud.minutosSolicitados, horasPorJornada)}">5 días</dd>
                </div>
                <div>
                    <dt class="text-suave text-sm">Saldo</dt>
                    <dd>
                        <span th:text="${@formatos.tiempo(empleado.saldoVacacionesMinutos, horasPorJornada)}">7 días</span>
                        <span aria-hidden="true" class="text-acento">→</span>
                        <span class="sr-only">queda en</span>
                        <span class="font-semibold" th:text="${@formatos.tiempo(saldoDespues, horasPorJornada)}">12 días</span>
                    </dd>
                </div>
            </dl>

            <p class="text-suave">
                La solicitud no se borra: queda en el historial, marcada como anulada y con el motivo.
            </p>

            <form th:action="@{/solicitudes/{id}/anular(id=${solicitud.id})}" method="post"
                  th:object="${formularioAnulacion}" class="space-y-4">
                <div>
                    <label class="etiqueta" for="motivo">Motivo de la anulación</label>
                    <textarea class="campo min-h-20" th:field="*{motivo}" maxlength="300" rows="3" required
                              th:classappend="${#fields.hasErrors('motivo')} ? 'campo-error'"></textarea>
                    <p class="ayuda text-error" role="alert"
                       th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}">Error</p>
                </div>
                <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                    <a th:href="@{/empleados/{id}(id=${empleado.id})}" class="boton-secundario">No, volver</a>
                    <button type="submit" class="boton-peligro" data-un-solo-envio>Sí, anular</button>
                </div>
            </form>

        </div>
    </div>

</main>

</body>
</html>
