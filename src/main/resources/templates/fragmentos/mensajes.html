<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Avisos de la aplicación.

  aria-live="polite" hace que un lector de pantalla lea el mensaje cuando
  aparece, sin interrumpir lo que la persona esté haciendo.

  Cada aviso lleva color + icono + texto. Nunca solo color: quien no distingue
  el verde del rojo igual entiende qué pasó.
-->
<div th:fragment="avisos" aria-live="polite" class="space-y-3">

    <p th:if="${mensajeError}" class="alerta-error" role="alert">
        <span aria-hidden="true" class="text-xl leading-none">⚠</span>
        <span th:text="${mensajeError}">Mensaje de error</span>
    </p>

    <p th:if="${mensajeExito}" class="alerta-exito">
        <span aria-hidden="true" class="text-xl leading-none">✓</span>
        <span th:text="${mensajeExito}">Mensaje de éxito</span>
    </p>

    <p th:if="${mensajeAviso}" class="alerta-aviso">
        <span aria-hidden="true" class="text-xl leading-none">ℹ</span>
        <span th:text="${mensajeAviso}">Mensaje informativo</span>
    </p>

</div>

</body>
</html>
